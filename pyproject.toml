[project]
name = "negotium"
version = "0.1.0"
description = "Auto SI/SE agent system: GitHub Issues + Discord bug reports -> PM/Developer/Reviewer agents -> patch Diff proposals with MD GitOps archive."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Negotium Team" }]
keywords = ["llm", "agents", "gitops", "automation", "si", "se"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "discord.py>=2.3",
    "GitPython>=3.1",
    "PyGithub>=2.3",
    "langgraph>=0.2",
    "openai>=1.30",
    "tree-sitter>=0.21",
    "tree-sitter-languages>=1.10",
    "rank-bm25>=0.2.2",
    "portalocker>=2.8",
    "structlog>=24.1",
    "jinja2>=3.1",
    "typer>=0.12",
    "pyyaml>=6.0",
    "detect-secrets>=1.4",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "pypdf>=4.0",
]

[project.optional-dependencies]
# Optional OCR stack for image attachments when no vision-capable model is set.
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]
sandbox = ["docker>=7.0"]
# Heavy GPU stack — installed only on Linux dev machines with CUDA.
# flash-attn requires the host CUDA toolchain and tends to fail under
# pip's build isolation; install it manually after this group:
#   uv pip install --no-build-isolation 'flash-attn>=2.6'
local-ai = [
    "vllm>=0.6; platform_system == 'Linux'",
    "transformers>=4.44",
    "accelerate>=0.30",
]

[project.scripts]
negotium = "negotium.app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["negotium"]

[tool.hatch.build.targets.sdist]
include = ["negotium", "templates", "README.md", "pyproject.toml"]


[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["archive", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "N802"]
"negotium/app/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["archive/", "tests/fixtures/"]

[[tool.mypy.overrides]]
module = [
    "tree_sitter_languages.*",
    "rank_bm25.*",
    "github.*",
    "discord.*",
    "discord.ext.*",
    "portalocker.*",
    "git",
    "git.*",
    "langgraph.*",
    "openai",
    "openai.*",
    "openpyxl",
    "pypdf",
    "pypdf.*",
    "pytesseract",
    "PIL",
    "PIL.*",
    "transformers",
    "vllm",
    "torch",
]
ignore_missing_imports = true

# External-SDK boundary adapters: we rely on duck-typing into untyped libs.
[[tool.mypy.overrides]]
module = [
    "negotium.adapters.ingestion.discord_bot",
    "negotium.adapters.llm.openai_adapter",
    "negotium.adapters.llm.vllm_adapter",
    "negotium.adapters.llm.vllm_embedded_adapter",
    "negotium.adapters.llm.ollama_adapter",
    "negotium.adapters.notifier.github_notifier",
    "negotium.adapters.notifier.discord_notifier",
    "negotium.context.ast_indexer",
    "negotium.context.md_retriever",
    "negotium.context.repo_snapshot",
]
disallow_untyped_calls = false
disallow_any_decorated = false
disallow_untyped_decorators = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["negotium"]
omit = [
    "negotium/adapters/llm/vllm_adapter.py",
    "negotium/adapters/llm/vllm_embedded_adapter.py",
    "negotium/adapters/llm/ollama_adapter.py",
]
